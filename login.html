<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optical POS - Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Background Decorative Glows -->
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-cyan-600/30 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-blue-600/30 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-md z-10">
        
        <!-- App Header Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-cyan-500 to-blue-600 text-white text-3xl shadow-lg shadow-cyan-500/20 mb-3">
                <i class="fa-solid fa-glasses"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">LENS & VISION POS</h1>
            <p class="text-xs text-cyan-400 font-medium tracking-wide uppercase mt-1">Multi-Branch Optical Management System</p>
        </div>

        <!-- Login Form Card -->
        <div class="bg-slate-800/80 backdrop-blur-xl border border-slate-700/80 rounded-2xl p-6 sm:p-8 shadow-2xl">
            
            <h2 class="text-xl font-semibold text-white mb-2">Welcome back</h2>
            <p class="text-sm text-slate-400 mb-6">Sign in to your staff POS terminal account</p>

            <!-- Alert Notification Banner -->
            <div id="alert-banner" class="hidden p-3 rounded-lg text-sm mb-4 bg-rose-500/10 border border-rose-500/30 text-rose-300 flex items-start gap-2.5">
                <i class="fa-solid fa-circle-exclamation mt-0.5 text-rose-400"></i>
                <span id="alert-message">Invalid credentials provided.</span>
            </div>

            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">Email Address</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-regular fa-envelope text-sm"></i>
                        </div>
                        <input type="email" id="email" required placeholder="name@optical.com"
                            class="w-full bg-slate-900/90 border border-slate-700 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-lock text-sm"></i>
                        </div>
                        <input type="password" id="password" required placeholder="••••••••"
                            class="w-full bg-slate-900/90 border border-slate-700 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition">
                    </div>
                </div>

                <button type="submit" id="btn-login"
                    class="w-full mt-2 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-medium py-2.5 px-4 rounded-xl shadow-lg shadow-cyan-500/25 focus:outline-none focus:ring-2 focus:ring-cyan-400 transition flex items-center justify-center gap-2">
                    <span id="btn-text">Sign In to POS</span>
                    <i id="btn-spinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
                </button>
            </form>

        </div>
        
        <p class="text-center text-xs text-slate-500 mt-6">
            © 2026 Lens & Vision Optical POS Systems. Production Ready.
        </p>
    </div>

    <!-- Application Configurations & Auth Controller -->
    <script src="env-config.js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    
    <script>
        // Redirect to index if active user session exists
        if (AuthManager.getCurrentUser()) {
            window.location.href = 'index.html';
        }

        const loginForm = document.getElementById('login-form');
        const alertBanner = document.getElementById('alert-banner');
        const alertMessage = document.getElementById('alert-message');
        const btnText = document.getElementById('btn-text');
        const btnSpinner = document.getElementById('btn-spinner');
        const btnLogin = document.getElementById('btn-login');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertBanner.classList.add('hidden');

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            btnText.textContent = 'Authenticating...';
            btnSpinner.classList.remove('hidden');
            btnLogin.disabled = true;

            try {
                const result = await AuthManager.login(email, password);
                if (result.success) {
                    window.location.href = 'index.html';
                } else {
                    alertMessage.textContent = result.message || 'Login failed. Please check your credentials.';
                    alertBanner.classList.remove('hidden');
                }
            } catch (err) {
                alertMessage.textContent = 'An unexpected error occurred during login.';
                alertBanner.classList.remove('hidden');
            } finally {
                btnText.textContent = 'Sign In to POS';
                btnSpinner.classList.add('hidden');
                btnLogin.disabled = false;
            }
        });
    </script>
</body>
</html>
